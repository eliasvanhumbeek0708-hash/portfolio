<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Mijn Portfolio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

    <!-- Eigen CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
    #map {
        height: 400px !important;
        width: 100% !important;
        min-height: 400px !important;
        display: block !important;
        border: 3px solid #f277c5;
        border-radius: 15px;
        background: #222;
        z-index: 1;
    }

    .leaflet-container {
        height: 400px !important;
        width: 100% !important;
    }

    .leaflet-container img {
        max-width: none !important;
    }
</style>
</head>

<body>

<header class="header">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="index.html" class="logo-link">
            <h1 class="logo">Mijn Portfolio</h1>
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="portfolio.html">Portfolio</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </div>
</header>

<main class="container my-5">
    <div class="row g-4">

        <div class="col-lg-7">
            <h2 class="section-title">Contacteer mij</h2>

            <form class="contact-form" name="contact" method="POST" data-netlify="true" action="/contact.html">
                <input type="hidden" name="form-name" value="contact">

                <div class="mb-3">
                    <label for="naam" class="form-label">Naam</label>
                    <input type="text" id="naam" name="naam" class="form-control" placeholder="Vul je naam in" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Vul je e-mail in" required>
                </div>

                <div class="mb-3">
                    <label for="bericht" class="form-label">Bericht</label>
                    <textarea id="bericht" name="bericht" class="form-control" placeholder="Typ je bericht" required></textarea>
                </div>

                <button type="submit" class="btn btn-pink">Verstuur</button>
            </form>
        </div>

        <aside class="col-lg-5">
            <div class="sidebar-box mb-4">
                <h4>Mijn locatie</h4>
                <p>Antwerpen, België</p>

                <div id="map"></div>
            </div>

            <div class="sidebar-box">
                <h4>Contact info</h4>
                <p>Email: s169458@ap.be</p>
                <p>Tel: 0123456789</p>
            </div>
        </aside>

    </div>
</main>

<footer class="footer text-center">
    <p>© 2026 Mijn Portfolio</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Leaflet JS -->
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    window.onload = function () {
        var map = L.map("map").setView([51.176, 4.349 ], 13);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap contributors"
        }).addTo(map);

        L.marker([51.176, 4.349 ])
            .addTo(map)
            .bindPopup("Mijn locatie in Antwerpen")
            .openPopup();

        setTimeout(function () {
            map.invalidateSize();
        }, 500);
    };
</script>

<script src="js/script.js"></script>

</body>
</html>
